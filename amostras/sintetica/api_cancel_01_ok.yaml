openapi: 3.0.3
info: {title: Assinaturas, version: 1.0.0}
paths:
  /assinaturas:
    post:
      summary: Criar assinatura
      responses:
        '201': {description: criada}
  /assinaturas/{id}:
    delete:
      summary: Cancelar assinatura
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: cancelada}
