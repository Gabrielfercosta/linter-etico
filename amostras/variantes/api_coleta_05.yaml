openapi: 3.0.3
info: {title: Cadastro opcional, version: 1.0.0}
paths:
  /cadastro:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email]
              properties:
                nome: {type: string}
                email: {type: string}
                cpf: {type: string, description: opcional}
      responses:
        '201': {description: criado}
